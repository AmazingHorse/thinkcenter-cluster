---
- name: Bootstrap nodes post-install
  hosts: proxmox_nodes
  gather_facts: false
  tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 10

    - name: Gather facts
      ansible.builtin.setup:

    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Ensure /etc/hosts has node entries
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED — cluster nodes"
        block: |
          {% for host in groups['proxmox_nodes'] %}
          {{ hostvars[host]['ansible_host'] }} {{ host }} {{ host }}.{{ cluster_domain }}
          {% endfor %}
