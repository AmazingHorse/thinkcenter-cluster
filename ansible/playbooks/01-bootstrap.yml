---
- name: Bootstrap nodes post-install
  hosts: proxmox_nodes
  gather_facts: false
  tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 10

    - name: Gather facts
      ansible.builtin.setup:

    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Ensure /etc/hosts has node entries
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED — cluster nodes"
        block: |
          192.168.50.10 pve-01 pve-01.cluster.local
          192.168.50.11 pve-02 pve-02.cluster.local
          192.168.50.12 pve-03 pve-03.cluster.local
