---
# 00-generate-boot-config.yml — Render boot server configs & host_vars from cluster-manifest.yml

- name: Render Boot & Inventory Configurations
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../cluster-manifest.yml"
  vars:
    proxmox_root_password: "{{ lookup('env', 'PROXMOX_ROOT_PASSWORD') | default('ProxmoxDefault123!', true) }}"
    proxmox_ssh_public_key: "{{ lookup('env', 'PROXMOX_SSH_PUBLIC_KEY') | default('', true) }}"
  tasks:
    - name: Ensure config & inventory directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ playbook_dir }}/../../boot/dnsmasq"
        - "{{ playbook_dir }}/../../boot/ipxe"
        - "{{ playbook_dir }}/../../boot/assets/answers"
        - "{{ playbook_dir }}/../inventory/host_vars"
    - name: Render dnsmasq.conf
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/pve-base/templates/dnsmasq.conf.j2"
        dest: "{{ playbook_dir }}/../../boot/dnsmasq/dnsmasq.conf"
        mode: "0644"

    - name: Render autoexec.ipxe
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/pve-base/templates/autoexec.ipxe.j2"
        dest: "{{ playbook_dir }}/../../boot/assets/autoexec.ipxe"
        mode: "0644"
        newline_sequence: '\n'

    - name: Mirror autoexec.ipxe to boot/ipxe
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../boot/assets/autoexec.ipxe"
        dest: "{{ playbook_dir }}/../../boot/ipxe/autoexec.ipxe"
        mode: "0644"

    - name: Render Proxmox Answer TOML files (by MAC)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/pve-base/templates/proxmox-answer.toml.j2"
        dest: "{{ playbook_dir }}/../../boot/assets/answers/{{ item.mac | lower | replace(':', '-') }}.toml"
        mode: "0644"
      loop: "{{ nodes }}"

    - name: Render Proxmox Answer TOML files (by hostname)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/pve-base/templates/proxmox-answer.toml.j2"
        dest: "{{ playbook_dir }}/../../boot/assets/answers/{{ item.name }}.toml"
        mode: "0644"
      loop: "{{ nodes }}"

    - name: Render Ansible host_vars per node from manifest
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/pve-base/templates/host_vars.yml.j2"
        dest: "{{ playbook_dir }}/../inventory/host_vars/{{ item.name }}.yml"
        mode: "0644"
      loop: "{{ nodes }}"

    - name: Render default Proxmox Answer TOML fallback
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/pve-base/templates/proxmox-answer.toml.j2"
        dest: "{{ playbook_dir }}/../../boot/assets/answers/default.toml"
        mode: "0644"
      vars:
        item: "{{ nodes[0] }}"

    - name: Render known_hosts placeholder from cluster manifest
      ansible.builtin.copy:
        content: |
          # Auto-generated from cluster-manifest.yml via Ansible 00-generate-boot-config.yml
          {% for node in nodes %}
          # {{ node.name }}.{{ cluster.domain }} {{ node.ip }}
          {% endfor %}
        dest: "{{ playbook_dir }}/../inventory/known_hosts"
        mode: "0644"
