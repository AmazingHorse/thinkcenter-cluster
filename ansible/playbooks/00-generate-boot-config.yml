---
# 00-generate-boot-config.yml — Render boot server configs & host_vars from cluster-manifest.yml

- name: Render Boot & Inventory Configurations
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../cluster-manifest.yml"
  tasks:
    - name: Check if secrets file exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../secrets/vault.sops.yaml"
      register: vault_file

    - name: Load secrets if available
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../secrets/vault.sops.yaml"
      when: vault_file.stat.exists

    - name: Ensure config & inventory directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ playbook_dir }}/../../boot/dnsmasq"
        - "{{ playbook_dir }}/../../boot/assets/answers"
        - "{{ playbook_dir }}/../inventory/host_vars"

    - name: Render dnsmasq.conf
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/pve-base/templates/dnsmasq.conf.j2"
        dest: "{{ playbook_dir }}/../../boot/dnsmasq/dnsmasq.conf"
        mode: "0644"

    - name: Render autoexec.ipxe
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/pve-base/templates/autoexec.ipxe.j2"
        dest: "{{ playbook_dir }}/../../boot/assets/autoexec.ipxe"
        mode: "0644"
        newline_sequence: '\n'

    - name: Render Proxmox Answer TOML files (by MAC)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/pve-base/templates/proxmox-answer.toml.j2"
        dest: "{{ playbook_dir }}/../../boot/assets/answers/{{ item.mac | lower | replace(':', '-') }}.toml"
        mode: "0644"
      loop: "{{ nodes }}"

    - name: Render Proxmox Answer TOML files (by hostname)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/pve-base/templates/proxmox-answer.toml.j2"
        dest: "{{ playbook_dir }}/../../boot/assets/answers/{{ item.name }}.toml"
        mode: "0644"
      loop: "{{ nodes }}"

    - name: Render Ansible host_vars per node from manifest
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/pve-base/templates/host_vars.yml.j2"
        dest: "{{ playbook_dir }}/../inventory/host_vars/{{ item.name }}.yml"
        mode: "0644"
      loop: "{{ nodes }}"

    - name: Render proxmox-auto-installer-mode config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/pve-base/templates/proxmox-auto-installer-mode.j2"
        dest: "{{ playbook_dir }}/../../boot/assets/proxmox-auto-installer-mode"
        mode: "0644"

    - name: Check if initrd.img exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../boot/assets/initrd.img"
      register: initrd_file

    - name: Inject proxmox-auto-installer-mode into initrd.img ramdisk
      ansible.builtin.shell: |
        cd "{{ playbook_dir }}/../../boot/assets" && printf "proxmox-auto-installer-mode\n" | cpio -H newc -o >> initrd.img && rm -f proxmox-auto-installer-mode
      when: initrd_file.stat.exists
      ignore_errors: true
