---
- name: Remove enterprise repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    state: absent
  when: pve_remove_enterprise_repo

- name: Remove ceph enterprise repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/ceph.list
    state: absent
  when: pve_remove_enterprise_repo

- name: Add no-subscription repository
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve trixie pve-no-subscription"
    state: present
    filename: pve-no-subscription
  when: pve_add_no_subscription_repo

- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name:
      - frr          # FRRouting — used for cluster mesh OSPF
      - frr-pythontools
      - udev
      - curl
      - wget
      - htop
      - iotop
      - nvme-cli
      - zram-tools
      - cpufrequtils
      - ethtool
      - iperf3
      - lm-sensors

- name: Deploy udev NIC naming rules
  ansible.builtin.template:
    src: 70-cluster-nics.rules.j2
    dest: /etc/udev/rules.d/70-cluster-nics.rules
    owner: root
    group: root
    mode: "0644"
  notify: reload udev

- name: Flush handlers (apply udev rules before network config)
  ansible.builtin.meta: flush_handlers

- name: Verify stable NIC names exist
  ansible.builtin.command:
    cmd: "ip link show {{ item }}"
  loop:
    - "{{ nic_mgmt }}"
    - "{{ nic_cluster_a }}"
    - "{{ nic_cluster_b }}"
  changed_when: false
  register: nic_check
  failed_when: nic_check.rc != 0

- name: Disable FRR globally (SDN phase not active)
  ansible.builtin.systemd:
    name: frr
    enabled: false
    state: stopped
  when: not (pve_sdn_enabled | default(false)) and not (ospf_enabled | default(true))

- name: Configure zram swap for RAM cushion
  ansible.builtin.copy:
    dest: /etc/default/zramswap
    content: |
      # Configured by Ansible for ThinkCentre Xeon cluster
      ALGO=zstd
      PERCENT=25
      PRIORITY=100
    owner: root
    group: root
    mode: "0644"
  when: enable_zram_swap | default(true)
  notify: restart zramswap

- name: Ensure zramswap service is enabled and started
  ansible.builtin.systemd:
    name: zramswap
    enabled: true
    state: started
  when: enable_zram_swap | default(true)
  ignore_errors: true

- name: Set CPU scaling governor
  ansible.builtin.shell:
    cmd: "echo {{ cpu_governor | default('powersave') }} | tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"
  changed_when: false
  ignore_errors: true

- name: Disable unused PVE services to save RAM and CPU
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - spiceproxy
  when: disable_unused_pve_services | default(true)
  ignore_errors: true

- name: Disable PVE HA services when HA disabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - pve-ha-crm
    - pve-ha-lrm
  when:
    - disable_unused_pve_services | default(true)
    - not (pve_ha_enabled | default(false))
  ignore_errors: true
