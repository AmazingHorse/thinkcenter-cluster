---
- name: Remove enterprise repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    state: absent
  when: pve_remove_enterprise_repo

- name: Remove ceph enterprise repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/ceph.list
    state: absent
  when: pve_remove_enterprise_repo

- name: Add no-subscription repository
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription"
    state: present
    filename: pve-no-subscription
  when: pve_add_no_subscription_repo

- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name:
      - frr          # FRRouting — dormant until pve_sdn_enabled=true
      - frr-pythontools
      - udev
      - curl
      - wget
      - htop
      - iotop
      - nvme-cli
    state: present

- name: Deploy udev NIC naming rules
  ansible.builtin.template:
    src: 70-cluster-nics.rules.j2
    dest: /etc/udev/rules.d/70-cluster-nics.rules
    owner: root
    group: root
    mode: "0644"
  notify: reload udev

- name: Flush handlers (apply udev rules before network config)
  ansible.builtin.meta: flush_handlers

- name: Verify stable NIC names exist
  ansible.builtin.command:
    cmd: "ip link show {{ item }}"
  loop:
    - "{{ nic_mgmt }}"
    - "{{ nic_ceph }}"
    - "{{ nic_vm }}"
  changed_when: false
  register: nic_check
  failed_when: nic_check.rc != 0

- name: Disable FRR globally (SDN phase not active)
  ansible.builtin.systemd:
    name: frr
    enabled: false
    state: stopped
  when: not pve_sdn_enabled
