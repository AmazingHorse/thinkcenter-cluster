---
- name: Reload udev
  ansible.builtin.command:
    cmd: udevadm control --reload-rules
  changed_when: false

- name: Trigger udev
  ansible.builtin.command:
    cmd: udevadm trigger --subsystem-match=net --action=add
  changed_when: false

- name: Restart zramswap
  ansible.builtin.systemd:
    name: zramswap
    state: restarted
