---
- name: Set ZFS ARC max (cap memory usage)
  ansible.builtin.lineinfile:
    path: /etc/modprobe.d/zfs.conf
    line: "options zfs zfs_arc_max={{ zfs_arc_max_mb | int * 1024 * 1024 }}"
    regexp: "^options zfs zfs_arc_max"
    create: true
    mode: "0644"
  notify: Update initramfs
  when: (os_filesystem | default('zfs')) == 'zfs'

- name: Configure Ceph OSD partition (interim profile)
  when: storage_profile in ['interim', 'interim_single_ssd']
  block:
    - name: Check if Ceph OSD partition device exists
      ansible.builtin.stat:
        path: "{{ ceph_osd_partition }}"
      register: ceph_part_stat

    - name: Create partition 4 for Ceph OSD (only if not present)
      ansible.builtin.command:
        cmd: "parted -s {{ ceph_osd_disk }} -- mkpart ceph-osd {{ os_hdsize_gb | default(64) }}GiB 100%"
      changed_when: true
      when: not ceph_part_stat.stat.exists

    - name: Run partprobe to inform kernel of partition changes
      ansible.builtin.command:
        cmd: "partprobe {{ ceph_osd_disk }}"
      changed_when: true
      when: not ceph_part_stat.stat.exists

- name: No additional partitioning needed (target_nvme_ssd profile)
  when: storage_profile == 'target_nvme_ssd'
  ansible.builtin.debug:
    msg: >
      target_nvme_ssd: NVMe is OS disk, SSD is whole-disk Ceph OSD.
      No partitioning required by this role.
