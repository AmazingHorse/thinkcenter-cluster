---
# pve01 — 16 GB RAM node (primary / cluster bootstrapper)
#
# CONFIGURE: replace placeholder values with actual hardware details.
# One-time discovery: boot a live Linux image and run:
#   udevadm info /sys/class/net/<iface> | grep ID_PATH
# to find bus paths for eth-cluster-a and eth-cluster-b.

node_mac: "AA:BB:CC:DD:EE:01"   # Built-in NIC MAC (used for PXE identity)
node_ram_mb: 16384

# ── Storage profile ───────────────────────────────────────────────────────────
storage_profile: "interim_single_ssd"
os_disk: "/dev/sda"
ceph_osd_disk: "/dev/sda"
ceph_osd_partition: "/dev/sda2"

# ── ZFS ARC cap ───────────────────────────────────────────────────────────────
# 15% of 16 GB ≈ 2457 MB
zfs_arc_max_mb: 2457

# ── Cluster fabric — direct peer links ────────────────────────────────────────
# eth-cluster-a (USB NIC) connects directly to pve02
# eth-cluster-b (WiFi-slot NIC) connects directly to pve03
# Subnets: pve01↔pve02 = 10.10.12.0/30, pve01↔pve03 = 10.10.13.0/30
cluster_links:
  - iface: eth-cluster-a
    peer: pve02
    local_ip: "10.10.12.1"
    prefix: 30
  - iface: eth-cluster-b
    peer: pve03
    local_ip: "10.10.13.1"
    prefix: 30

# IP this node uses for Corosync ring 1 (any cluster-fabric IP works; pick cluster-a)
corosync_ring1_addr: "10.10.12.1"

# ── udev NIC bus paths ────────────────────────────────────────────────────────
# CONFIGURE: replace with actual bus paths from udevadm on this node.
udev_rules:
  - stable_name: eth-mgmt
    match_key: ID_PATH
    match_value: "pci-0000:00:1f.6"          # M910q built-in I219-LM (verify)
  - stable_name: eth-cluster-a
    match_key: ID_PATH
    match_value: "usb-0:REPLACE_USB_PATH:1.0" # USB NIC — must be same port on every node
  - stable_name: eth-cluster-b
    match_key: ID_PATH
    match_value: "pci-0000:01:00.0"           # WiFi-slot NIC (verify slot)
