---
# pve03 — 8 GB RAM node
# eth-cluster-a connects to pve01, eth-cluster-b connects to pve02
# CONFIGURE: replace placeholder values.

node_mac: "AA:BB:CC:DD:EE:03"
node_ram_mb: 8192

storage_profile: "interim_single_ssd"
os_disk: "/dev/sda"
ceph_osd_disk: "/dev/sda"
ceph_osd_partition: "/dev/sda2"

zfs_arc_max_mb: 1228

cluster_links:
  - iface: eth-cluster-a
    peer: pve01
    local_ip: "10.10.13.2"
    prefix: 30
  - iface: eth-cluster-b
    peer: pve02
    local_ip: "10.10.23.2"
    prefix: 30

corosync_ring1_addr: "10.10.13.2"

udev_rules:
  - stable_name: eth-mgmt
    match_key: ID_PATH
    match_value: "pci-0000:00:1f.6"
  - stable_name: eth-cluster-a
    match_key: ID_PATH
    match_value: "usb-0:REPLACE_USB_PATH:1.0"
  - stable_name: eth-cluster-b
    match_key: ID_PATH
    match_value: "pci-0000:01:00.0"
