---
# ── Version pins (single source of truth) ────────────────────────────────────
# To upgrade: change these values, re-run boot/scripts/fetch-assets.sh,
# then run the upgrade playbook with ha-manager drain.
pve_version: "9.2"
pve_iso_filename: "proxmox-ve_9.2-1.iso"
pve_iso_sha256: "REPLACE_WITH_OFFICIAL_SHA256"
pve_iso_url: "https://enterprise.proxmox.com/iso/{{ pve_iso_filename }}"
ceph_version: "tentacle"   # 20.2.x, managed via pveceph

# ── Cluster identity ──────────────────────────────────────────────────────────
cluster_name: "thinkcenter"
cluster_domain: "cluster.local"

# ── Network — flat L2 POC ─────────────────────────────────────────────────────
# Phase 1: flat L2. Phase 2: add vlan_id per interface. Phase 3: pve_sdn_enabled.
management_subnet: "192.168.50.0/24"
management_gateway: "192.168.50.1"
boot_server_ip: "192.168.50.1"

# VLAN stubs — null = untagged (POC). Set to a VLAN ID when Mikrotik is configured.
vlan_id_mgmt: ~
vlan_id_ceph: ~
vlan_id_vm: ~

# ── SDN ───────────────────────────────────────────────────────────────────────
# Set to true when ready to configure Proxmox SDN (Phase 3).
# Requires frr package (installed by pve-base but unconfigured when false).
pve_sdn_enabled: false

# ── NIC stable names ─────────────────────────────────────────────────────────
# eth-mgmt:      built-in 1G, connects to LAN switch
# eth-cluster-a: USB 2.5G, direct cable to one peer node
# eth-cluster-b: WiFi-slot 2.5G, direct cable to other peer node
# Peer assignments (which cable goes where) defined in host_vars per node.
nic_mgmt: "eth-mgmt"
nic_cluster_a: "eth-cluster-a"
nic_cluster_b: "eth-cluster-b"

# ── VM bridge ─────────────────────────────────────────────────────────────────
# VMs share eth-mgmt during POC. SDN VNet name replaces vmbr0 in Phase 3.
vm_bridge: "vmbr0"

# ── Ansible connection ────────────────────────────────────────────────────────
ansible_user: root
ansible_ssh_private_key_file: "~/.ssh/id_ed25519"

# ── Proxmox no-subscription repo ─────────────────────────────────────────────
pve_remove_enterprise_repo: true
pve_add_no_subscription_repo: true

# ── Corosync ──────────────────────────────────────────────────────────────────
# Ring 0: management NIC (LAN switch). Ring 1: cluster fabric (direct links).
# Each node's specific ring1 IP is set in host_vars (it differs per node).
corosync_ring0_iface: "{{ nic_mgmt }}"
corosync_ring1_enabled: true   # both direct-link NICs form ring 1 via OSPF-routed IPs

# ── Ceph ──────────────────────────────────────────────────────────────────────
# cluster_network covers all three /30 direct-link subnets (OSPF routes between them)
# public_network is the management subnet (for client/VM access to Ceph)
ceph_network_cluster: "10.10.0.0/8"
ceph_network_public: "192.168.50.0/24"
ceph_pool_name: "ceph-vm"
ceph_pool_replicas: 3

# ── OSPF (frr) ────────────────────────────────────────────────────────────────
# OSPF runs on cluster NICs only; redistributes connected /30 routes.
# frr is already installed by pve-base role.
ospf_area: "0.0.0.0"   # single backbone area
ospf_enabled: true

# ── HA manager ───────────────────────────────────────────────────────────────
# Used by the rolling-upgrade task to safely drain a node before reboot.
ha_manager_enabled: true
