---
# Canonical node list — single source of truth for MAC → hostname → role.
# Keep this in sync with:
#   boot/dnsmasq/dnsmasq.conf   (MAC → static IP)
#   boot/matchbox/groups/*.json  (MAC → boot profile)

all:
  children:
    proxmox_nodes:
      hosts:
        pve01:
          ansible_host: 192.168.50.10
        pve02:
          ansible_host: 192.168.50.11
        pve03:
          ansible_host: 192.168.50.12

    # First node bootstraps the cluster; others join it.
    proxmox_primary:
      hosts:
        pve01:

    proxmox_workers:
      hosts:
        pve02:
        pve03:
