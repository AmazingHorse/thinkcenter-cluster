# dnsmasq configuration for thinkcenter-cluster boot server
#
# Edit the values marked CONFIGURE before starting the boot stack.
# See docs/runbook.md for the full day-0 procedure.

# ── Interface ─────────────────────────────────────────────────────────────────
# CONFIGURE: set to the NIC that is on the same L2 as the ThinkCentre nodes.
# On a Hyper-V External Switch VM this will be the VM's bridged interface (e.g. eth0).
interface=eth0

# ── DHCP ──────────────────────────────────────────────────────────────────────
# Discovery range — temporary IPs for unknown clients
dhcp-range=192.168.50.100,192.168.50.199,12h

# Static leases — MAC → IP → hostname
# CONFIGURE: replace MAC addresses with your actual node MACs.
# Keep IPs outside the discovery range above.
dhcp-host=AA:BB:CC:DD:EE:01,192.168.50.10,pve01
dhcp-host=AA:BB:CC:DD:EE:02,192.168.50.11,pve02
dhcp-host=AA:BB:CC:DD:EE:03,192.168.50.12,pve03

# ── TFTP / PXE ────────────────────────────────────────────────────────────────
enable-tftp
tftp-root=/var/lib/matchbox/assets

# PXE: serve iPXE binary, then chain to matchbox for the boot script
# CONFIGURE: replace 192.168.50.1 with this host's IP on the cluster network.
dhcp-boot=tag:!ipxe,undionly.kpxe
dhcp-boot=tag:ipxe,http://192.168.50.1:8080/boot.ipxe

# iPXE user class tag (so we can distinguish iPXE from UEFI PXE ROM)
dhcp-userclass=set:ipxe,iPXE

# ── DNS ───────────────────────────────────────────────────────────────────────
domain=cluster.local
local=/cluster.local/
expand-hosts

# ── Logging ───────────────────────────────────────────────────────────────────
log-queries
log-dhcp
