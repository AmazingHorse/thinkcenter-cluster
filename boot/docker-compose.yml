# Boot server stack — nginx + dnsmasq + prepare-pxe (build tool)
#
# Run on a Linux host (or Hyper-V VM with External Switch on Windows).
# Requires network_mode: host so dnsmasq can broadcast DHCP on the physical LAN.
# See docs/windows-setup.md before running on Windows.

services:

  nginx:
    image: python:3.12-alpine
    restart: unless-stopped
    network_mode: host
    command: ["python3", "/srv/boot_http_server.py", "--root", "/var/lib/boot", "--port", "8080"]
    volumes:
      - ./server/boot_http_server.py:/srv/boot_http_server.py:ro
      - ./assets:/var/lib/boot/assets:ro
      - ./ipxe:/var/lib/boot/ipxe:ro
    # boot_http_server serves:
    #   GET /autoexec.ipxe          → iPXE script
    #   GET/POST /assets/answers/*  → per-node Proxmox answer TOML (inspects POST JSON MAC addresses)
    #   GET /assets/<file>          → PVE kernel (linux26), initrd.img, proxmox.iso.cpio, iPXE binaries
  dnsmasq:
    image: strm/dnsmasq:latest
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    command: ["-C", "/etc/dnsmasq/dnsmasq.conf"]
    volumes:
      - ./dnsmasq:/etc/dnsmasq:ro
      - ./assets:/var/lib/boot/assets:ro
    # dnsmasq provides:
    #   DHCP with static leases (MAC → IP)
    #   TFTP root for iPXE binary
    #   PXE option 66/67 pointing at the boot HTTP server (:8080)

  # One-shot build tool — NOT started by `just up` / `docker compose up`.
  # Usage: docker compose -f boot/docker-compose.yml run --rm prepare-pxe \
  #            /assets/<iso> <answer_url> /assets/pxe-prepared
  # Called automatically by fetch-assets.sh when proxmox-auto-install-assistant
  # is not found on the host PATH.
  prepare-pxe:
    build:
      context: ./prepare-pxe
      dockerfile: Dockerfile
    profiles: [tools]
    volumes:
      - ./assets:/assets
