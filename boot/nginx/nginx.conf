events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;

        # Direct static asset serving for iPXE, kernel, and initrd
        location /assets/ {
            alias /var/lib/boot/assets/;
            autoindex on;
        }

        # Proxmox answer file location — intercept 405 Method Not Allowed on POST
        # and return the static TOML answer file with 200 OK
        location /assets/answers/ {
            alias /var/lib/boot/assets/answers/;
            error_page 405 =200 $uri;
            default_type application/toml;
        }

        # Root iPXE script fallback
        location /autoexec.ipxe {
            alias /var/lib/boot/assets/autoexec.ipxe;
            default_type text/plain;
        }
    }
}
