events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 8080;
        server_name _;

        root /var/lib/boot;

        # Direct static asset serving for iPXE, kernel, and initrd
        location /assets/ {
            autoindex on;
        }

        # Proxmox answer file location — intercept 405 Method Not Allowed on POST
        # and transform POST to GET via proxy_method so Nginx streams static TOML file body
        location /assets/answers/ {
            error_page 405 =200 @serve_toml;
            default_type application/toml;
        }

        location @serve_toml {
            proxy_method GET;
            proxy_pass http://127.0.0.1:8080$request_uri;
        }

        # Root iPXE script fallback
        location = /autoexec.ipxe {
            alias /var/lib/boot/assets/autoexec.ipxe;
            default_type text/plain;
        }
    }
}
