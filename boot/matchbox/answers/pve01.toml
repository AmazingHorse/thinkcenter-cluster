[global]
keyboard = en-us
country = us
fqdn = pve01.cluster.local
mailto = ""
timezone = America/New_York
root_password = "REPLACE_WITH_SOPS_MANAGED_SECRET"

[network]
source = from-dhcp

[disk-setup]
filesystem = zfs
zfs.raid = single
# CONFIGURE: set to the disk device for this node (e.g. /dev/sda)
# Partition layout managed post-install by Ansible pve-storage role:
#   partition 1 → ZFS rpool (Proxmox OS)
#   partition 2 → Ceph OSD (interim, storage_profile=interim_single_ssd)
disk_list = /dev/sda

[post-installation-webhook]
# Notify Ansible control node that install is complete (optional, see runbook)
# url = http://192.168.50.1:9090/installed
# verify-tls = false
