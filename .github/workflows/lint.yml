name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible-lint
        run: pip install ansible-lint yamllint

      - name: Run yamllint
        run: yamllint . cluster-manifest.yml

      - name: Run ansible-lint
        run: ansible-lint ansible/
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
