# Single Source of Truth Manifest for ThinkCentre Cluster

cluster:
  name: "thinkcenter"
  domain: "cluster.local"
  pve_version: "9.2"
  pve_iso_sha256: "REPLACE_WITH_OFFICIAL_SHA256"
  ceph_version: "tentacle"
  management_subnet: "192.168.50.0/24"
  management_gateway: "192.168.50.1"
  boot_server_ip: "192.168.50.1"

nodes:
  - name: "pve01"
    mac: "AA:BB:CC:DD:EE:01"
    ip: "192.168.50.10"
    ram_mb: 16384
    storage_profile: "interim_single_ssd"
    os_disk: "/dev/sda"
    ceph_osd_disk: "/dev/sda"
    ceph_osd_partition: "/dev/sda2"
    zfs_arc_max_mb: 2457
    corosync_ring1_addr: "10.10.12.1"
    links:
      - iface: "eth-cluster-a"
        peer: "pve02"
        local_ip: "10.10.12.1"
        prefix: 30
      - iface: "eth-cluster-b"
        peer: "pve03"
        local_ip: "10.10.13.1"
        prefix: 30
    udev_rules:
      - stable_name: "eth-mgmt"
        match_key: "ID_PATH"
        match_value: "pci-0000:00:1f.6"
      - stable_name: "eth-cluster-a"
        match_key: "ID_PATH"
        match_value: "usb-0:REPLACE_USB_PATH:1.0"
      - stable_name: "eth-cluster-b"
        match_key: "ID_PATH"
        match_value: "pci-0000:01:00.0"

  - name: "pve02"
    mac: "AA:BB:CC:DD:EE:02"
    ip: "192.168.50.11"
    ram_mb: 8192
    storage_profile: "interim_single_ssd"
    os_disk: "/dev/sda"
    ceph_osd_disk: "/dev/sda"
    ceph_osd_partition: "/dev/sda2"
    zfs_arc_max_mb: 1228
    corosync_ring1_addr: "10.10.12.2"
    links:
      - iface: "eth-cluster-a"
        peer: "pve01"
        local_ip: "10.10.12.2"
        prefix: 30
      - iface: "eth-cluster-b"
        peer: "pve03"
        local_ip: "10.10.23.1"
        prefix: 30
    udev_rules:
      - stable_name: "eth-mgmt"
        match_key: "ID_PATH"
        match_value: "pci-0000:00:1f.6"
      - stable_name: "eth-cluster-a"
        match_key: "ID_PATH"
        match_value: "usb-0:REPLACE_USB_PATH:1.0"
      - stable_name: "eth-cluster-b"
        match_key: "ID_PATH"
        match_value: "pci-0000:01:00.0"

  - name: "pve03"
    mac: "AA:BB:CC:DD:EE:03"
    ip: "192.168.50.12"
